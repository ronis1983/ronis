<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RONIS — עיצוב אתרים מעולם אחר</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;600;800&family=Inter:wght@900&display=swap">
    <link rel="stylesheet" href="index.css">
</head>
<body>

<section class="hero">

    <!-- Decorative wave along the bottom edge -->
    <img class="hero__wave" src="images/wave-bottom.svg" alt="" aria-hidden="true">

    <!-- Soft ground shadow under the artwork -->
    <img class="hero__shadow" src="images/hero-shadow.svg" alt="" aria-hidden="true">

    <p class="hero__wordmark">RONIS</p>

    <div class="hero__copy">
        <h1 class="hero__headline">
            <span class="hero__headline-top">עיצוב אתרים</span>
            <span class="hero__headline-bottom">מעולם אחר</span>
        </h1>
        <a class="hero__cta" href="#">צפייה בעבודות</a>
    </div>

    <img class="hero__art" src="images/hero-rhino.png" alt="רוני רוכב על קרנף ורוד">

    <header class="site-header">
        <a class="site-logo" href="#">RONIS</a>
        <nav>
            <ul class="nav-list">
                <li><a class="nav-link" href="#">אודות</a></li>
                <li class="nav-divider" aria-hidden="true">
                    <img src="images/nav-divider.svg" alt="">
                </li>
                <li><a class="nav-link" href="#">אודות</a></li>
                <li><a class="nav-link nav-link--pill" href="#">אודות</a></li>
            </ul>
        </nav>
    </header>

</section>

</body>
</html>
