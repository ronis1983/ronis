<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>צור קשר — RONIS</title>
    <meta name="description" content="יצירת קשר עם RONIS.">

    <!-- What a shared link shows in WhatsApp, LinkedIn and the rest. The urls
         have to be absolute, so they name the site directly: change both if the
         site ever moves to its own domain. -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="RONIS">
    <meta property="og:locale" content="he_IL">
    <meta property="og:title" content="צור קשר — RONIS">
    <meta property="og:description" content="ספרו במשפט מה אתם רוצים לבנות.">
    <meta property="og:url" content="https://thirsty-lewin-e4d076.netlify.app/contact.html">
    <meta property="og:image" content="https://thirsty-lewin-e4d076.netlify.app/images/social-card.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="RONIS — רוני רוכב על קרנף ורוד">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="theme-color" content="#c9c554">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="site.css">
    <link rel="preload" href="fonts/inter-900-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/assistant-hebrew.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/assistant-latin.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body>

<div class="page">

    <header class="site-header">
        <a class="site-logo" href="index.html">RONIS</a>
        <button class="nav-toggle" type="button" aria-expanded="false"
                aria-controls="site-nav" aria-label="פתיחת תפריט">
            <span class="nav-toggle__bars" aria-hidden="true"></span>
        </button>
        <nav id="site-nav" class="site-nav" aria-label="ראשי">
            <ul class="nav-list">
                <li><a class="nav-link" href="index.html#about"><span class="optical">אודות</span></a></li>
                <li class="nav-divider" aria-hidden="true"></li>
                <li><a class="nav-link" href="index.html#projects"><span class="optical">פרויקטים</span></a></li>
                <li class="nav-divider" aria-hidden="true"></li>
                <li><a class="nav-link is-current" href="contact.html" aria-current="page"><span class="optical">צור קשר</span></a></li>
            </ul>
        </nav>
    </header>

    <main class="page__main">

        <h1 class="page__title">צור קשר</h1>
        <p class="page__lead">ספרו במשפט מה אתם רוצים לבנות.</p>

        <!-- The name, method and data-netlify attributes are what Netlify
             matches submissions against, so they are kept exactly as they
             were. bot-field is a honeypot: real people never see it, bots
             fill it in, and Netlify discards those submissions. -->
        <form class="form" name="contact" method="POST" data-netlify="true" data-netlify-honeypot="bot-field">
            <input type="hidden" name="form-name" value="contact">
            <p class="form__hp">
                <label>אל תמלאו את השדה הזה: <input name="bot-field" tabindex="-1" autocomplete="off"></label>
            </p>

            <label class="field">
                <span>שם</span>
                <input type="text" name="name" autocomplete="name" required>
            </label>

            <label class="field">
                <span>אימייל</span>
                <input type="email" name="email" autocomplete="email" required>
            </label>

            <label class="field">
                <span>הודעה</span>
                <textarea name="message" required></textarea>
            </label>

            <p style="margin: 0">
                <button class="button" type="submit"><span class="optical">שליחה</span></button>
            </p>
        </form>

    </main>

</div>

<script src="site.js" defer></script>

</body>
</html>
